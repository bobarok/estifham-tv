<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استفهام — شاشة التلفزيون</title>
<style>
  /* Served by the host's phone (DisplayServer). Kept dependency-free so it
     runs on weak smart-TV browsers, and so the same page can later be the
     Chromecast receiver. Drawn on a 1920x1080 stage scaled to the screen.
     Every path is relative: fonts/, categories/, brand/, media/ and sounds/
     sit next to the page on the phone and on the public Chromecast site. */
  @font-face { font-family: Cairo; src: url(fonts/Cairo-Variable.ttf) format("truetype"); font-weight: 200 1000; }
  @font-face { font-family: "Baloo Bhaijaan 2"; src: url(fonts/BalooBhaijaan2-Variable.ttf) format("truetype"); font-weight: 400 800; }
  :root {
    --bg: #F6F9FD; --surface: #FFFFFF; --raised: #EDF2F8; --ink: #1F2B47; --muted: #6B7A90; --disabled: #A9B6C7;
    --border: #D6E6F7; --border-strong: #C3CEDD; --press: #E3ECF6;
    --gold: #FFC53D; --gold-text: #B8740A; --gold-soft: #FFF3D9; --gold-border: #F5C342;
    --first: #4DA3F0; --first-text: #1C7DD6; --first-soft: #EAF4FD;
    --second: #F58A2B; --second-text: #E0721A; --second-soft: #FFF1E3;
    --red: #E5484D; --red-text: #C9353A; --red-soft: #FDECEC; --red-border: #F4B4B6;
    --tile600: #FDECEC; --tile600-border: #F4B4B6; --tile600-text: #C9353A; --nobody: #B8C4D4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  html.blackout, html.blackout body { background: #000; }
  html.blackout #stage { visibility: hidden; }
  body { font-family: Cairo, "Segoe UI", Tahoma, sans-serif; color: var(--ink); }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    background: var(--bg); transform-origin: center; overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; }
  .screen { position: absolute; inset: 0; padding: 40px 56px 36px; display: flex; flex-direction: column; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .panel { background: var(--surface); border: 4px solid var(--border); border-radius: 32px; }
  .muted { color: var(--muted); }
  .gold { color: var(--gold-text); }
  .num { font-family: "Baloo Bhaijaan 2", Cairo, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .t-first { color: var(--first-text); }
  .t-second { color: var(--second-text); }

  .logo { width: 300px; height: 300px; object-fit: contain; display: block; }
  h1 { font-size: 140px; font-weight: 900; line-height: 1.25; }

  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 8px 34px; border-radius: 999px;
    background: var(--surface); border: 4px solid var(--border); font-size: 38px; font-weight: 800; }
  .chip.gold { background: var(--gold-soft); border-color: var(--gold-border); }

  /* Team cards */
  .topbar { display: flex; align-items: stretch; gap: 28px; flex: none; height: 156px; }
  .topbar.small { height: 124px; }
  .tcard { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 0 32px; border-radius: 36px; background: var(--surface); border: 4px solid var(--border); }
  .tcard.on-first { background: var(--first-soft); border: 5px solid var(--first); box-shadow: 0 20px 50px rgba(77,163,240,.28); }
  .tcard.on-second { background: var(--second-soft); border: 5px solid var(--second); box-shadow: 0 20px 50px rgba(245,138,43,.28); }
  .small .tcard { flex: none; width: 520px; padding: 0 28px; border-radius: 32px; gap: 16px; }
  .crest { width: 64px; height: 64px; border-radius: 50%; color: #fff; flex: none; font-size: 36px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; }
  .small .crest { width: 54px; height: 54px; font-size: 30px; }
  .crest.first { background: var(--first); } .crest.second { background: var(--second); }
  .tinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; margin-inline-start: 18px; }
  .small .tinfo { margin-inline-start: 14px; }
  .tname { font-size: 44px; font-weight: 900; line-height: 1.3; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small .tname { font-size: 36px; }
  .tmeta { display: flex; align-items: center; gap: 12px; }
  .tscore { flex: none; font-size: 104px; line-height: 1; white-space: nowrap; }
  .small .tscore { font-size: 72px; }
  .side { display: flex; align-items: center; min-width: 0; }
  .tcard > .side { flex: 1; }
  .turnpill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px;
    background: var(--second); color: #fff; font-size: 22px; font-weight: 800; white-space: nowrap; }
  .turnpill.first { background: var(--first-text); }
  .turnpill.double { background: var(--red); }

  /* A team's lifelines: solid in each one's own color while left, grey and
     faded once used, ringed while in play (same colors as the app). */
  .aids { display: flex; gap: 8px; }
  .aid { width: 44px; height: 44px; border-radius: 50%; color: #fff; border: 2px solid transparent; flex: none;
    display: inline-flex; align-items: center; justify-content: center; }
  .small .aids { gap: 5px; }
  .small .aid { width: 32px; height: 32px; }
  .aid svg { width: 25px; height: 25px; }
  .small .aid svg { width: 19px; height: 19px; }
  .aid.used { color: var(--disabled); background: var(--raised) !important; border-color: var(--border-strong); opacity: .55; }
  .aid.lit { box-shadow: 0 0 0 5px rgba(229,72,77,.5); }
  /* Under a question whose answer is a year: a year before or after counts. */
  .nearhint { align-self: center; display: inline-flex; align-items: center; gap: 12px; padding: 12px 30px; border-radius: 999px;
    background: #FFF3D9; border: 3px solid #F5C342; color: #B8740A; font-size: 36px; font-weight: 800; line-height: 1.3; }
  .nearhint svg { width: 40px; height: 40px; flex: none; }
  /* The board's «دبل» bar for the team picking now. */
  .dbl { align-self: center; flex: none; display: inline-flex; align-items: center; gap: 12px; height: 64px; margin-top: 18px; padding: 0 34px;
    border-radius: 999px; font-size: 30px; font-weight: 900; line-height: 1.2; white-space: nowrap;
    background: var(--red-soft); border: 3px solid var(--red); color: var(--red-text); }
  .dbl svg { width: 38px; height: 38px; color: var(--red); }
  .dbl.on { background: linear-gradient(180deg, #F0646A, #E5484D); border-color: transparent; color: #fff; box-shadow: 0 12px 36px rgba(229,72,77,.45); }
  .dbl.on svg { color: #fff; }
  .dbl.used { background: var(--raised); border-color: var(--border-strong); color: var(--muted); }
  .dbl.used svg { color: var(--disabled); }
  /* Under the question: the picking team's lifelines as big boxes. */
  .boxes { flex: none; display: flex; gap: 18px; height: 76px; margin-top: 20px; }
  .box { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 18px;
    border-radius: 24px; border: 3px solid; background: var(--surface); color: var(--ink); font-size: 30px; font-weight: 900; line-height: 1.2; }
  .box .ic { width: 48px; height: 48px; border-radius: 50%; flex: none; color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .box .ic svg { width: 28px; height: 28px; }
  .box span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box.on { color: #fff; }
  .box.on .ic { background: #fff !important; }
  .box.used { background: var(--raised); border-color: var(--border-strong) !important; color: var(--disabled); }
  .box.used .ic { background: var(--border) !important; color: var(--disabled); }
  .box.used span.t { text-decoration: line-through; }

  /* Board */
  .mid { flex: none; width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .mid .logo { width: 104px; height: 104px; }
  .progress { font-size: 26px; line-height: 1.2; color: var(--muted); }
  /* One column per category: its picture and name on top, its questions going down. */
  .grid { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 18px; margin-top: 18px; min-height: 0; }
  .col { display: grid; grid-template-rows: 116px repeat(6, minmax(0, 1fr)); gap: 18px; min-height: 0; }
  .cat { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 12px; text-align: center;
    border-radius: 26px; background: linear-gradient(180deg, #FFFFFF, #EAF4FD); border: 3px solid #CFE3F7;
    box-shadow: 0 6px 0 #CFE3F7; overflow: hidden; min-width: 0; }
  .cat .catimg { filter: drop-shadow(0 4px 6px rgba(31, 43, 71, .2)); }
  .catimg { width: 72px; height: 72px; object-fit: contain; display: block; flex: none; }
  .cat .name { font-size: 34px; font-weight: 900; line-height: 1.25; min-width: 0; overflow: hidden; overflow-wrap: anywhere; }
  .tile { display: flex; align-items: center; justify-content: center; border-radius: 26px; font-size: 60px; line-height: 1;
    background: var(--surface); border: 3px solid var(--border); box-shadow: 0 6px 0 var(--press); color: var(--first-text); }
  .tile.v400 { color: var(--second-text); }
  .tile.v600 { background: var(--tile600); border-color: var(--tile600-border); color: var(--tile600-text); }
  .tile.used { background: var(--raised); border: 0; box-shadow: none; }
  .tile i { width: 34px; height: 34px; border-radius: 50%; display: block; background: var(--nobody); box-shadow: 0 0 0 6px #fff; }
  .tile i.first { background: var(--first); } .tile i.second { background: var(--second); }

  /* Question */
  .midchips { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 20px; }
  .catpill { display: inline-flex; align-items: center; gap: 16px; height: 92px; padding: 0 36px 0 36px; min-width: 0; border-radius: 999px;
    background: var(--surface); border: 4px solid var(--border); }
  .catpill .catimg { width: 68px; height: 68px; margin-inline-start: -20px; }
  .catpill .name { font-size: 40px; font-weight: 900; line-height: 1.3; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .points { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 92px; padding: 0 34px; border-radius: 999px;
    background: var(--gold-soft); border: 4px solid var(--gold-border); color: var(--gold-text); font-size: 52px; line-height: 1; }
  .points.double { background: var(--red-soft); border-color: var(--red); color: var(--red-text); }
  .points svg { width: 46px; height: 46px; color: var(--red); }
  .qbody { flex: 1; display: flex; align-items: stretch; gap: 36px; min-height: 0; margin-top: 28px; }
  .qcard { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 44px 60px; border-radius: 48px; background: var(--surface); border: 4px solid var(--border);
    box-shadow: 0 30px 70px rgba(30,60,120,.1); overflow: hidden; }
  .qcard .deco1 { position: absolute; top: 34px; left: 40px; }
  .qcard .deco2 { position: absolute; bottom: 36px; right: 44px; }
  .qmain { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative; }
  .qmain img { min-height: 0; border-radius: 28px; object-fit: contain; }
  .zoombox { overflow: hidden; border-radius: 28px; flex: none; line-height: 0; filter: drop-shadow(0 0 14px rgba(0, 0, 0, 0.7)); }
  .fullimg { padding: 40px; align-items: center; justify-content: center; }
  .fullimg .zoombox img { max-width: 1840px !important; }
  .zoombox img { transform-origin: 0 0; transition: transform 0.12s linear; }
  .qtext { font-size: 76px; font-weight: 800; line-height: 1.55; text-align: center; }
  .audio { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--second-text); font-size: 40px; font-weight: 800; line-height: 1.3; }
  .audio .icon { font-size: 150px; line-height: 1; }
  .tcol { flex: none; width: 460px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 0; }
  .timer { width: 420px; height: 420px; position: relative; flex: none; }
  .timer svg { display: block; width: 420px; height: 420px; }
  .timer .arc { transition: stroke-dashoffset .95s linear, stroke .3s; }
  .timer .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer .value { font-size: 176px; line-height: 1; }
  .timer .state { font-size: 30px; font-weight: 800; line-height: 1.3; color: var(--muted); }
  .timer .state.paused { color: var(--gold-text); }
  .whose { max-width: 460px; height: 64px; padding: 0 28px; display: inline-flex; align-items: center; border-radius: 999px; flex: none;
    font-size: 32px; font-weight: 800; border: 3px solid; }
  .whose span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .whose.first { background: var(--first-soft); border-color: var(--first); color: var(--first-text); }
  .whose.second { background: var(--second-soft); border-color: var(--second); color: var(--second-text); }
  .active { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 8px 22px; border-radius: 28px;
    background: var(--gold); color: #fff; font-size: 24px; font-weight: 800; line-height: 1.35; text-align: center; }
  .active svg { width: 30px; height: 30px; flex: none; }
  .foot { flex: none; display: flex; align-items: center; justify-content: space-between; height: 44px; margin-top: 20px; font-size: 24px; font-weight: 800; color: var(--muted); }
  .foot b { font-weight: 800; color: var(--ink); }
  .foot .brandline { display: inline-flex; align-items: center; gap: 12px; font-size: 22px; color: #8A97AA; }
  .foot .brandline img { width: 44px; height: 44px; object-fit: contain; display: block; }

  /* Answer */
  .ansbody { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; margin-top: 20px; }
  .ansbody .qtext { font-size: 48px; font-weight: 700; line-height: 1.5; color: var(--muted); }
  .answer-card { width: 1400px; padding: 36px 60px 44px; border-radius: 48px; text-align: center; flex: none;
    background: var(--surface); border: 5px solid var(--gold); box-shadow: 0 30px 70px rgba(255,197,61,.28); }
  .answer-card .label { display: inline-block; padding: 2px 34px; border-radius: 999px; background: var(--gold-soft);
    font-size: 36px; font-weight: 800; color: var(--gold-text); }
  .answer-card .value { font-size: 104px; font-weight: 800; line-height: 1.35; margin-top: 12px; }
  .answer-card .note { font-size: 34px; font-weight: 700; margin-top: 8px; color: var(--muted); }
  .reveal { animation: reveal .6s ease-out both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }

  /* Categories & results */
  .slots { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 180px; gap: 32px; margin-top: 72px; align-content: start; }
  .slot { border: 4px dashed var(--border-strong); border-radius: 36px; display: flex; align-items: center; gap: 28px; padding: 0 40px; font-size: 56px; font-weight: 800; min-width: 0; }
  .slot.filled { background: var(--surface); border: 4px solid var(--gold-border); box-shadow: 0 16px 40px rgba(30,60,120,.08); }
  .slot .n { color: var(--gold-text); }
  .ctiles { flex: 1; display: grid; gap: 12px; min-height: 0; }
  .ctile { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 0; padding: 4%;
    background: var(--surface); border: 4px solid var(--border); border-radius: 22px; }
  .ctile .catimg { width: 52%; height: 52%; aspect-ratio: 1; }
  .ctile .name { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere; }
  .ctile .badge { display: none; position: absolute; top: 6px; inset-inline-start: 6px; width: 28%; aspect-ratio: 1; border-radius: 50%;
    align-items: center; justify-content: center; background: var(--gold); }
  .ctile.picked { background: var(--gold-soft); border-color: var(--gold-border); }
  .ctile.picked .badge { display: flex; }
  .ctile.dim { opacity: .4; }
  .results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; width: 100%; margin-top: 64px; }
  .result { display: flex; align-items: center; gap: 22px; padding: 40px 48px; border-radius: 44px; min-width: 0; }
  .result.win-first { border: 6px solid var(--first); background: var(--first-soft); box-shadow: 0 30px 70px rgba(77,163,240,.28); }
  .result.win-second { border: 6px solid var(--second); background: var(--second-soft); box-shadow: 0 30px 70px rgba(245,138,43,.28); }
  .result .name { font-size: 54px; font-weight: 900; line-height: 1.3; flex: 1; min-width: 0; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .score { font-size: 110px; line-height: 1; }
  .guess { flex: 1; min-width: 0; flex-direction: column; gap: 2px; padding: 16px 24px; text-align: center; }
  .guess .name { flex: none; font-size: 40px; max-width: 100%; }
  .guess .score { font-size: 80px; }
  .guess.win { border: 6px solid var(--gold); }

  #status { position: fixed; bottom: 16px; left: 16px; padding: 8px 16px; border-radius: 12px;
    background: rgba(31,43,71,.85); color: #fff; font: 700 16px Cairo, sans-serif; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" style="top:-260px;right:-200px;width:640px;height:640px;background:#FBDDBF"></div>
  <div class="blob" style="top:-200px;left:-320px;width:700px;height:600px;background:#D7E9FA"></div>
  <div class="blob" style="bottom:-320px;left:-220px;width:720px;height:680px;background:#DCEBFA"></div>
  <div class="blob" style="bottom:-300px;right:-200px;width:600px;height:600px;background:#FBDFC4"></div>
  <div id="view"></div>
</div>
<div id="status"></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var view = document.getElementById('view');
  var statusEl = document.getElementById('status');

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function points(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function team(state, id) { for (var i = 0; i < state.teams.length; i++) if (state.teams[i].id === id) return state.teams[i]; }
  function other(id) { return id === 'first' ? 'second' : 'first'; }

  // A picture that may be missing (a player's own category has none): it
  // just disappears.
  function picture(src, cls) {
    return '<img class="' + cls + '" src="' + src + '" alt="" onerror="this.style.display=\'none\'">';
  }
  function logo() { return picture('brand/logo.webp', 'logo'); }
  // id is missing when the phone runs an older version of the app.
  function categoryPicture(id) { return id ? picture('categories/' + encodeURIComponent(id) + '.webp', 'catimg') : ''; }

  // «دبل» is a red flame and «استريح» an open hand.
  var FLAME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
  function stroked(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      paths.map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</svg>';
  }
  // The lifelines, in the app's order, with their colors (AppColors.lifeline*).
  // desc is how the phone names one that is active on a question
  // (Lifeline.description in lib/models/lifeline.dart).
  var LIFELINES = [
    { label: 'إجابتان', color: '#0E9C92', desc: 'يحق للفريق تقديم إجابتين', icon: stroked(['M2.5 12.5l4 4 8-9', 'M11.5 16.5l2 2 8-9']) },
    { label: 'استريح', color: '#7C5CD6', desc: 'لاعب من الخصم يستريح ولا يجاوب', icon: stroked(['M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2', 'M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2', 'M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8', 'M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15']) },
    { label: 'دبل', color: '#E5484D', desc: 'النقاط مضاعفة إذا جاوب الفريق صح', icon: FLAME },
    { label: 'بدل السؤال', color: '#2E9E4F', desc: 'سؤال ثاني من نفس الفئة وبنفس النقاط', icon: stroked(['M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8', 'M21 3v5h-5', 'M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16', 'M8 16H3v5']) },
    { label: 'بوق السؤال', color: '#D6408B', desc: 'الخصم ياخذ السؤال ويجاوب بروحه، وإذا غلط تروح النقاط لصاحب السؤال', icon: stroked(['M7 7h11l-3-3', 'M17 17H6l3 3']) }
  ];
  var DOUBLE = LIFELINES[2], STEAL = LIFELINES[4];
  // «تُقبل سنة قبل أو بعد»: arrows up and down.
  var UPDOWN = stroked(['M7 15l5 5 5-5', 'M7 9l5-5 5 5']);
  // The lifelines this phone's app has (an older one sends no list and has
  // no «بدل السؤال»).
  function lifelinesOf(s) {
    var names = s.lifelines || ['إجابتان', 'استريح', 'دبل', 'بوق السؤال'];
    return LIFELINES.filter(function (l) { return names.indexOf(l.label) >= 0; });
  }
  function isActive(q, lifeline) { return q.lifelines.indexOf(lifeline.desc) >= 0; }

  // Whose time it is: the answering team (after «بوق السؤال», the one that
  // took the question) for the first minute, then the other team.
  function answering(q) { return isActive(q, STEAL) ? other(q.chosenBy) : q.chosenBy; }

  // An older app sends only elapsed and running.
  function timerOf(s) {
    var t = s.timer;
    if (t.remaining !== undefined) return t;
    var flipped = t.elapsed >= 60, remaining = flipped ? Math.max(0, 90 - t.elapsed) : 60 - t.elapsed;
    return { running: t.running, flipped: flipped, remaining: remaining, fraction: remaining / (flipped ? 30 : 60) };
  }

  function idle() {
    return '<div class="screen center">' + logo().replace('class="logo"', 'class="logo" style="width:480px;height:480px"') +
      '<div class="muted" style="font-size:40px;font-weight:700;margin-top:24px">بانتظار بدء اللعبة</div></div>';
  }

  // The whole catalog, so the room chooses together: the columns that give
  // the biggest tiles with every category on screen.
  function tileColumns(n, width, height, gap) {
    var best = 1, bestSide = 0;
    for (var c = 1; c <= Math.max(n, 1); c++) {
      var rows = Math.ceil(n / c);
      var side = Math.min((width - gap * (c - 1)) / c, (height - gap * (rows - 1)) / Math.max(rows, 1));
      if (side > bestSide) { best = c; bestSide = side; }
    }
    return best;
  }
  function tileClass(c, s) {
    return 'ctile' + (c.pick ? ' picked' : s.pickedCategories.length === s.categoryCount ? ' dim' : '');
  }
  function categoryTiles(s) {
    var n = s.catalog.length, gap = 12, width = 1824, height = 900;
    var cols = tileColumns(n, width, height, gap), rows = Math.ceil(n / cols);
    var cell = (height - gap * (rows - 1)) / rows;
    var tiles = s.catalog.map(function (c) {
      return '<div class="' + tileClass(c, s) + '" data-id="' + esc(c.id) + '">' + categoryPicture(c.id) +
        '<span class="name" style="font-size:' + Math.round(cell * 0.17) + 'px">' + esc(c.name) + '</span>' +
        '<span class="badge num" style="font-size:' + Math.round(cell * 0.17) + 'px">' + (c.pick || '') + '</span></div>';
    }).join('');
    return '<div class="screen" style="padding:28px 48px 36px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;height:96px;margin-bottom:16px;flex:none">' +
      '<div style="font-size:60px;font-weight:900;line-height:1.3">اختيار الفئات</div>' +
      '<div class="gold tilecount" style="font-size:48px;font-weight:800">' + tileCount(s) + '</div></div>' +
      '<div class="ctiles" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr));grid-template-rows:repeat(' + rows + ',minmax(0,1fr))">' + tiles + '</div></div>';
  }
  function tileCount(s) {
    return '<span class="num">' + s.pickedCategories.length + '</span> من <span class="num">' + s.categoryCount + '</span>';
  }
  // A pick only changes the marks: the pictures stay, with no flicker.
  function patchTiles(s) {
    if (s.status !== 'categories' || !s.catalog || !s.catalog.length) return false;
    var tiles = stage.querySelectorAll('.ctile');
    if (tiles.length !== s.catalog.length) return false;
    for (var i = 0; i < tiles.length; i++) if (tiles[i].getAttribute('data-id') !== s.catalog[i].id) return false;
    for (i = 0; i < tiles.length; i++) {
      tiles[i].className = tileClass(s.catalog[i], s);
      tiles[i].querySelector('.badge').textContent = s.catalog[i].pick || '';
    }
    stage.querySelector('.tilecount').innerHTML = tileCount(s);
    return true;
  }

  function categories(s) {
    // A phone on an older version of the app sends only the picks.
    if (s.catalog && s.catalog.length) return categoryTiles(s);
    var slots = '';
    for (var i = 0; i < s.categoryCount; i++) {
      var name = s.pickedCategories[i];
      slots += name
        ? '<div class="slot filled"><span class="n num">' + (i + 1) + '</span><span class="tname" style="font-size:56px">' + esc(name) + '</span></div>'
        : '<div class="slot"></div>';
    }
    return '<div class="screen" style="padding:90px 160px;align-items:center">' +
      '<div style="font-size:96px;font-weight:900;line-height:1.3">اختيار الفئات</div>' +
      '<div class="gold" style="font-size:44px;font-weight:800;margin-top:8px"><span class="num">' + s.pickedCategories.length + '</span> من <span class="num">' + s.categoryCount + '</span></div>' +
      '<div class="slots" style="width:100%">' + slots + '</div></div>';
  }

  // lit: the lifeline is in play right now (only «دبل» shows it here).
  function aids(s, t, lit) {
    return '<span class="aids">' + lifelinesOf(s).map(function (l) {
      var left = t.lifelinesLeft.indexOf(l.label) >= 0, on = lit && l === DOUBLE;
      return '<span class="aid' + (on ? ' lit' : left ? '' : ' used') + '" style="background:' + l.color + '">' + l.icon + '</span>';
    }).join('') + '</span>';
  }

  // The board's «دبل» bar for the team picking now.
  function doubleBar(s) {
    var name = esc(team(s, s.turn).name), left = team(s, s.turn).lifelinesLeft.indexOf(DOUBLE.label) >= 0;
    var cls = s.doubleNext ? ' on' : left ? '' : ' used';
    var text = s.doubleNext ? 'دبل! السؤال اللي يختاره ' + name + ' نقاطه مضاعفة'
      : left ? 'دبل متاح لـ ' + name : name + ' استخدموا الدبل';
    return '<div class="dbl' + cls + '">' + DOUBLE.icon + '<span>' + text + '</span></div>';
  }

  // Under the question: the picking team's lifelines as boxes («بوق السؤال»
  // is the other team's): filled while in play, struck through once used.
  // «دبل» is chosen on the board, so it shows here only when in play.
  function boxes(s) {
    var q = s.question;
    return '<div class="boxes">' + lifelinesOf(s).filter(function (l) { return l !== DOUBLE || isActive(q, l); }).map(function (l) {
      var who = l === STEAL ? other(q.chosenBy) : q.chosenBy;
      var on = isActive(q, l), left = team(s, who).lifelinesLeft.indexOf(l.label) >= 0;
      var cls = on ? ' on' : left ? '' : ' used';
      var style = on ? 'background:' + l.color + ';border-color:' + l.color : 'border-color:' + l.color + '8C';
      return '<div class="box' + cls + '" style="' + style + '"><span class="ic" style="background:' + l.color + ';color:' + (on ? l.color : '#fff') + '">' +
        l.icon + '</span><span class="t">' + esc(l.label) + '</span></div>';
    }).join('') + '</div>';
  }

  // on: this team's turn, in its color. extra: what goes before its lifelines.
  function teamCard(s, id, on, extra, lit) {
    var t = team(s, id);
    return '<div class="tcard' + (on ? ' on-' + id : '') + '"><div class="side">' +
      '<span class="crest ' + id + ' num">' + (id === 'first' ? '1' : '2') + '</span>' +
      '<div class="tinfo"><div class="tname">' + esc(t.name) + '</div>' +
      '<div class="tmeta">' + (extra || '') + aids(s, t, lit) + '</div></div></div>' +
      '<span class="tscore num t-' + id + '">' + points(t.score) + '</span></div>';
  }

  function board(s) {
    function card(id) {
      var on = s.turn === id, doubled = on && s.doubleNext;
      var pill = !on ? '' : doubled
        ? '<span class="turnpill double">دورهم — دبل</span>'
        : '<span class="turnpill ' + id + '">دورهم</span>';
      return teamCard(s, id, on, pill, doubled);
    }
    var columns = s.board.map(function (c) {
      return '<div class="col"><div class="cat">' + categoryPicture(c.id) + '<span class="name">' + esc(c.name) + '</span></div>' + c.questions.map(function (q) {
        if (q.used) return '<div class="tile used"><i class="' + (q.by || '') + '"></i></div>';
        return '<div class="tile num' + (q.value >= 600 ? ' v600' : q.value >= 400 ? ' v400' : '') + '">' + q.value + '</div>';
      }).join('') + '</div>';
    }).join('');
    return '<div class="screen">' +
      '<div class="topbar">' + card('first') +
      '<div class="mid">' + logo() + '<span class="progress num">' + Math.min(s.answered + 1, s.total) + ' / ' + s.total + '</span></div>' +
      card('second') + '</div>' +
      doubleBar(s) + '<div class="grid">' + columns + '</div></div>';
  }

  // The team cards and, between them, the category and the question's points:
  // doubled and red with «دبل».
  function questionTop(s, on) {
    var q = s.question, doubled = isActive(q, DOUBLE);
    function card(id) { return teamCard(s, id, on === id, '', doubled && q.chosenBy === id); }
    return '<div class="topbar small">' + card('first') +
      '<div class="midchips"><span class="catpill">' + categoryPicture(q.categoryId) + '<span class="name">' + esc(q.category) + '</span></span>' +
      '<span class="points' + (doubled ? ' double' : '') + '">' + (doubled ? FLAME : '') + '<span class="num">' + (doubled ? q.value * 2 : q.value) + '</span></span></div>' +
      card('second') + '</div>';
  }

  function foot(s, middle) {
    return '<div class="foot"><span>السؤال <b class="num">' + Math.min(s.answered + 1, s.total) + '</b> من <b class="num">' + s.total + '</b></span>' +
      (middle || '') +
      '<span class="brandline">' + picture('brand/logo.webp', '') + '<span>استفهام</span></span></div>';
  }

  function media(q, maxHeight) {
    // The public Chromecast site only has opaque file names (mediaId).
    var file = window.cast && window.cast.framework ? q.mediaId : q.media;
    if (q.type === 'image' && file) {
      // In a clipping box, so the host's zoom (applyZoom) stays inside it.
      return '<div class="zoombox"><img src="media/' + encodeURI(file) + '" alt="" style="height:' + maxHeight + 'px;width:auto;max-width:1120px"></div>';
    }
    if (q.type === 'hum') {
      return '<div class="audio"><svg class="icon" viewBox="0 0 24 24" width="150" height="150" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>دندنها!</div>';
    }
    if (q.type === 'act') {
      return '<div class="audio"><svg class="icon" viewBox="0 0 24 24" width="150" height="150" fill="currentColor"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z"/></svg>ولا كلمة!</div>';
    }
    if (q.type === 'audio') {
      return '<div class="audio"><svg class="icon" viewBox="0 0 24 24" width="150" height="150" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>سؤال صوتي</div>';
    }
    return '';
  }

  // The ring's shape; paintTimer fills in the time, which changes every
  // second without redrawing the page.
  var RING = 2 * Math.PI * 70, lastFraction = 0;
  function timerRing() {
    return '<div class="timer"><svg viewBox="0 0 172 172">' +
      '<circle cx="86" cy="86" r="70" fill="#FFFFFF" stroke="#E3EEF9" stroke-width="12"/>' +
      '<circle class="arc" cx="86" cy="86" r="70" fill="none" stroke-width="12" stroke-linecap="round"' +
      ' stroke-dasharray="' + RING + '" transform="rotate(-90 86 86)"/></svg>' +
      '<div class="label"><span class="value num"></span><span class="state"></span></div></div>';
  }
  function paintTimer(s) {
    var el = stage.querySelector('.timer');
    if (!el || !s.question) return;
    var t = timerOf(s), who = answering(s.question), now = t.flipped ? other(who) : who;
    var arc = el.querySelector('.arc'), state = el.querySelector('.state');
    // The ring only sweeps down; when it fills again at the flip it just jumps.
    arc.style.transition = t.fraction > lastFraction ? 'none' : '';
    lastFraction = t.fraction;
    arc.style.strokeDashoffset = RING * (1 - t.fraction);
    arc.style.stroke = now === 'first' ? '#4DA3F0' : '#F58A2B';
    arc.style.opacity = t.running ? 1 : 0.45;
    el.querySelector('.value').textContent = t.remaining;
    var paused = !t.running && !(t.flipped && t.remaining === 0);
    state.textContent = paused ? 'متوقف' : 'ثانية';
    state.className = 'state' + (paused ? ' paused' : '');
  }

  function question(s) {
    var q = s.question, t = timerOf(s), who = answering(q), now = t.flipped ? other(who) : who;
    var name = esc(team(s, now).name);
    var active = LIFELINES.filter(function (l) { return isActive(q, l); }).map(function (l) {
      return '<div class="active" style="background:' + l.color + '">' + l.icon + '<span>' + (l === DOUBLE
        ? 'دبل مفعّل — السؤال بـ <span class="num">' + q.value * 2 + '</span>'
        : esc(l.desc)) + '</span></div>';
    }).join('');
    return '<div class="screen">' + questionTop(s, now) +
      '<div class="qbody"><div class="qcard fitbox">' +
      '<svg class="deco1" width="64" height="64" viewBox="0 0 26 26" fill="none" stroke="#F5B840" stroke-width="3" stroke-linecap="round"><path d="M4 22l4-7"/><path d="M11 18l5-6"/><path d="M14 24l7-3"/></svg>' +
      '<svg class="deco2" width="56" height="56" viewBox="0 0 24 24" fill="#FFC53D"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>' +
      '<div class="qmain">' + media(q, 420) +
      '<div class="qtext" style="font-size:' + (q.type === 'text' ? 76 : 56) + 'px">' + esc(q.text) + '</div>' +
      (q.nearbyHint ? '<div class="nearhint">' + UPDOWN + '<span>تُقبل سنة قبل أو بعد</span></div>' : '') + '</div></div>' +
      '<div class="tcol">' + timerRing() +
      '<div class="whose ' + now + '"><span>' + (t.flipped ? (name.indexOf('ال') === 0 ? 'انقلب لل' + name.slice(2) : 'انقلب لـ' + name) : 'دور ' + name) + '</span></div>' + active + '</div></div>' +
      boxes(s) + foot(s) + '</div>';
  }

  function answer(s) {
    var q = s.question;
    return '<div class="screen">' + questionTop(s, null) +
      '<div class="ansbody fitbox">' +
      (q.type === 'image' ? media(q, 280) : '') +
      '<div class="qtext">' + esc(q.text) + '</div>' +
      '<div class="answer-card reveal"><div class="label">الإجابة</div><div class="value">' + esc(q.answer) + '</div>' +
        (q.nearby ? '<div class="note">يُقبل أيضاً: ' + q.nearby[0] + ' أو ' + q.nearby[1] + '</div>' : '') + '</div>' +
      '</div>' + foot(s, '<span>بانتظار قرار المتحكم</span>') + '</div>';
  }

  // «سؤال فاصل»: the question; once revealed, the answer and both guesses.
  function tiebreak(s) {
    var t = s.tieBreak;
    if (!t) return idle();
    var result = '';
    if (t.answer !== null) {
      // The answer in the middle on top, the two teams under it on each side.
      result = '<div class="answer-card reveal" style="width:640px;margin:16px auto 0;padding:12px 28px 16px"><div class="label" style="font-size:30px">الجواب</div><div class="value num" style="font-size:80px;line-height:1.2;margin-top:4px">' + esc(t.answer) + '</div></div>' +
        '<div style="display:flex;gap:28px;margin-top:20px;flex:none">' +
        ['first', 'second'].map(function (id) {
          var win = t.winner === id, d = t.distances[id];
          return '<div class="panel result guess' + (win ? ' win' : '') + '">' +
            '<span class="name">' + esc(team(s, id).name) + '</span>' +
            '<span class="score num t-' + id + '">' + esc(t.guesses[id]) + '</span>' +
            '<span class="' + (win ? 'gold' : 'muted') + '" style="font-size:30px;font-weight:700">' + (d === 0 ? 'بالضبط!' : 'بعيد بـ ' + points(d)) + '</span></div>';
        }).join('') + '</div>' +
        (t.winner ? '' : '<div class="gold" style="font-size:40px;font-weight:800;text-align:center;margin-top:16px">' + (t.distances.first === 0 && t.distances.second === 0 ? 'الثنين جابوها بالضبط!' : 'نفس البعد!') + ' سؤال ثاني يحسمها.</div>');
    }
    return '<div class="screen">' +
      '<div style="display:flex;gap:20px;flex:none"><span class="chip gold">سؤال فاصل</span><span class="chip">' + esc(t.category) + '</span></div>' +
      '<div class="gold" style="font-size:40px;font-weight:700;margin-top:16px;flex:none">تعادل! كل فريق يخمّن بالسر، والأقرب للجواب يفوز.</div>' +
      '<div class="ansbody fitbox" style="margin-top:12px"><div class="qtext" style="font-size:72px;color:var(--ink);font-weight:800">' + esc(t.text) + '</div></div>' +
      result + '</div>';
  }

  function finished(s) {
    var order = s.leader ? [s.leader, other(s.leader)] : ['first', 'second'];
    var title = s.leader
      ? '<span class="t-' + s.leader + '">الفائز: ' + esc(team(s, s.leader).name) + '</span>'
      : '<span class="gold">تعادل!</span>';
    if (s.wonByTieBreak) title += ' <span class="gold" style="font-size:36px">(بالسؤال الفاصل)</span>';
    return '<div class="screen center" style="padding:80px 120px">' +
      '<img class="logo" src="brand/logo.webp" alt="" style="width:200px;height:200px;margin-bottom:12px" onerror="this.style.display=\'none\'"><h1 style="font-size:110px">انتهت اللعبة</h1>' +
      '<div style="font-size:48px;font-weight:800;line-height:1.4;margin-top:4px">' + title + '</div>' +
      '<div class="results">' + order.map(function (id) {
        var t = team(s, id), win = s.leader === id;
        return '<div class="panel result' + (win ? ' win-' + id : '') + '"><span class="crest ' + id + ' num">' + (id === 'first' ? '1' : '2') + '</span>' +
          '<span class="name">' + esc(t.name) + '</span><span class="score num t-' + id + '">' + points(t.score) + '</span></div>';
      }).join('') + '</div></div>';
  }

  var lastHtml = null, lastZoom = null;
  var ownWindow = /[?&]window=1/.test(location.search);

  function fullImage(s) {
    return '<div class="screen fullimg">' + media(s.question, 1000) + '</div>';
  }

  // Long names shrink until they fit their box (down to a limit): a team
  // name in its card (then it ends in «…»), and a category name on top of
  // its column. A long question or answer shrinks until its box holds it.
  // Text centred in its box overflows on both sides, which scrollHeight misses.
  function lineCount(el) {
    var range = document.createRange();
    range.selectNodeContents(el);
    return range.getClientRects().length;
  }
  function fitNames() {
    var names = stage.querySelectorAll('.tname, .cat .name, .catpill .name, .result .name, .ctile .name, .whose span');
    for (var i = 0; i < names.length; i++) {
      var el = names[i], size = parseFloat(getComputedStyle(el).fontSize);
      // Cairo's letters are taller than their line, so height is only checked
      // on the category names, which may take two lines.
      var cls = el.parentNode.className, tile = cls.indexOf('ctile') === 0, twoLines = cls === 'cat' || tile;
      while ((el.scrollWidth > el.clientWidth || (twoLines && el.scrollHeight > size * 3.2) || (tile && lineCount(el) > 2)) &&
          size > (tile ? 19 : 22)) {
        el.style.fontSize = (size -= 1) + 'px';
      }
      // Still too long to read in two lines: three, with a smaller picture.
      if (tile && lineCount(el) > 2) {
        var pic = el.parentNode.querySelector('.catimg');
        if (pic) pic.style.width = pic.style.height = '36%';
      }
    }
    var box = stage.querySelector('.fitbox');
    if (!box) return;
    var texts = box.querySelectorAll('.qtext, .answer-card .value');
    var sizes = [], k = 1, j;
    for (j = 0; j < texts.length; j++) sizes.push(parseFloat(getComputedStyle(texts[j]).fontSize));
    while (box.scrollHeight > box.clientHeight && k > 0.45) {
      k -= 0.05;
      for (j = 0; j < texts.length; j++) texts[j].style.fontSize = sizes[j] * k + 'px';
    }
  }
  // The fonts arrive after the first drawing, and text can grow with them.
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitNames);

  function render(s) {
    // AirPlay and Android mirroring (TvWindow): black while a song or a title is being acted out.
    document.documentElement.classList.toggle('blackout', ownWindow && s.status === 'question' &&
      !!s.question && (s.question.type === 'hum' || s.question.type === 'act'));
    var html;
    switch (s.status) {
      case 'categories': html = categories(s); break;
      case 'board': html = board(s); break;
      case 'question': html = s.question ? question(s) : idle(); break;
      case 'answer': html = s.question ? answer(s) : idle(); break;
      case 'finished': html = finished(s); break;
      case 'tiebreak': html = tiebreak(s); break;
      default: html = idle();
    }
    // The host opened the question image full screen on the phone.
    if (s.zoom && s.question && s.question.type === 'image' && (s.status === 'question' || s.status === 'answer')) {
      html = fullImage(s);
    }
    if (html !== lastHtml && patchTiles(s)) lastHtml = html;
    // Zoom updates arrive many times a second: keep the page, move the image.
    if (html !== lastHtml) {
      // A score can change with an image open: keep the same image element,
      // so a zoomed image does not jump back and reload.
      var old = stage.querySelector('.zoombox img');
      view.innerHTML = html;
      lastHtml = html;
      var img = stage.querySelector('.zoombox img');
      if (old && img && old.src === img.src && old.style.height === img.style.height) img.replaceWith(old);
      else if (img) img.addEventListener('load', function () { applyZoom(lastZoom); });
      fitNames();
    }
    paintTimer(s);
    lastZoom = s.zoom;
    applyZoom(s.zoom);
    playSound(s);
    playEffect(s);
  }

  // The game's sound effects (a question opens, the answer, the result…),
  // played here instead of on the phone while the TV shows the game. Each
  // one counts up effect.n; the one already there when the page loads is
  // not replayed.
  var fxAudio = new Audio(), fxN;
  function playEffect(s) {
    var e = s.effect;
    if (!e) { if (fxN === undefined) fxN = null; return; }
    if (fxN === undefined) { fxN = e.n; return; }
    if (e.n === fxN) return;
    fxN = e.n;
    fxAudio.src = 'sounds/' + encodeURIComponent(e.name) + '.wav';
    var p = fxAudio.play();
    if (p && p.catch) p.catch(showSoundHint);
  }

  // The question's sound, when the host taps «استمع» with the TV showing:
  // each tap counts up sound.n and plays it from the start. A TV browser
  // may refuse to play before someone presses a key: then a hint asks for
  // OK on the remote, which plays it.
  var tvAudio = new Audio(), soundN = null, soundFile = null, soundHint = null;
  function playSound(s) {
    var q = s.question, file = q && q.type === 'audio' ? (window.cast && window.cast.framework ? q.mediaId : q.media) : null;
    var onScreen = file && (s.status === 'question' || s.status === 'answer');
    if (!onScreen || file !== soundFile) {
      tvAudio.pause();
      hideSoundHint();
      soundFile = onScreen ? file : null;
    }
    if (!onScreen || !s.sound) return;
    if (!s.sound.playing) {
      tvAudio.pause();
      hideSoundHint();
      return;
    }
    if (s.sound.n === soundN) return;
    soundN = s.sound.n;
    tvAudio.src = 'media/' + encodeURI(file);
    tvAudio.currentTime = 0;
    var p = tvAudio.play();
    if (p && p.catch) p.catch(showSoundHint);
  }
  function showSoundHint() {
    if (soundHint) return;
    soundHint = document.createElement('div');
    soundHint.className = 'panel';
    soundHint.style.cssText = 'position:fixed;left:50%;top:40px;transform:translateX(-50%);padding:18px 36px;font-size:28px;font-weight:700;color:var(--gold-text);z-index:5';
    soundHint.textContent = 'اضغط OK في الريموت لتشغيل الصوت';
    document.body.appendChild(soundHint);
  }
  function hideSoundHint() {
    if (soundHint) soundHint.remove();
    soundHint = null;
  }
  function soundAllowed() {
    if (!soundHint) return;
    hideSoundHint();
    if (soundFile) {
      tvAudio.currentTime = 0;
      tvAudio.play().catch(function () {});
    }
  }
  document.addEventListener('keydown', soundAllowed);
  document.addEventListener('click', soundAllowed);

  // Shows the part of the image the host zoomed into on the phone: image
  // point (u, v), as fractions, in the middle, magnified s times.
  function applyZoom(z) {
    var img = stage.querySelector('.zoombox img');
    if (!img) return;
    if (!z || !(z.s > 1) || !img.naturalWidth) { img.style.transform = ''; return; }
    var W = img.clientWidth, H = img.clientHeight;
    // The picture inside the element (object-fit: contain).
    var fit = Math.min(W / img.naturalWidth, H / img.naturalHeight);
    var cw = img.naturalWidth * fit, ch = img.naturalHeight * fit;
    var ox = (W - cw) / 2, oy = (H - ch) / 2;
    function axis(size, offset, content, at) {
      var t = size / 2 - z.s * (offset + at * content);
      var scaled = z.s * content;
      if (scaled <= size) return (size - scaled) / 2 - z.s * offset;
      return Math.min(-z.s * offset, Math.max(size - z.s * (offset + content), t));
    }
    var tx = axis(W, ox, cw, z.u), ty = axis(H, oy, ch, z.v);
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z.s + ')';
  }
  // Also the entry point for other transports (e.g. a Chromecast receiver).
  window.estifhamRender = render;

  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.style.display = text ? 'block' : 'none';
  }

  function connect() {
    var ws;
    try { ws = new WebSocket('ws://' + location.host + '/ws'); } catch (e) { return setTimeout(connect, 2000); }
    showStatus('جارٍ الاتصال بالجوال…');
    ws.onopen = function () { showStatus(''); };
    ws.onmessage = function (e) { try { render(JSON.parse(e.data)); } catch (err) { /* ignore bad frames */ } };
    ws.onclose = function () { showStatus('انقطع الاتصال بالجوال — جارٍ إعادة المحاولة…'); setTimeout(connect, 2000); };
  }

  // On a Chromecast (the page is loaded with the Cast receiver SDK by
  // tool/build_cast_receiver.dart), the phone sends each state as a custom
  // message instead of over the WebSocket.
  function receive() {
    var NS = 'urn:x-cast:app.estifham.tv';
    var context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NS, function (e) {
      try { render(typeof e.data === 'string' ? JSON.parse(e.data) : e.data); } catch (err) { /* ignore bad messages */ }
    });
    var options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = {};
    options.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
    options.disableIdleTimeout = true; // a quiz has long pauses without media
    options.skipPlayersLoad = true;
    context.start(options);
  }

  // Keep the TV awake: a quiz has long stretches with no media and no
  // remote presses, after which TVs sleep or start their screensaver.
  // The Wake Lock API needs https (the Chromecast page); elsewhere (the
  // phone's Wi-Fi address) a tiny muted video playing in a corner keeps
  // most TV browsers from treating the page as idle.
  function keepAwake() {
    var lock = null;
    function requestLock() {
      if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock) return;
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l;
        l.addEventListener('release', function () { lock = null; });
      }).catch(function () { /* not allowed here: the video below still runs */ });
    }
    document.addEventListener('visibilitychange', requestLock);
    requestLock();

    var canvas = document.createElement('canvas');
    if (!canvas.captureStream) return;
    canvas.width = canvas.height = 2;
    var ctx = canvas.getContext('2d'), tick = 0;
    var video = document.createElement('video');
    video.muted = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.style.cssText = 'position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none';
    video.srcObject = canvas.captureStream(1);
    document.body.appendChild(video);
    function frame() {
      // A changing frame, so the stream never stalls.
      ctx.fillStyle = (tick++ % 2) ? '#0b1220' : '#0c1321';
      ctx.fillRect(0, 0, 2, 2);
    }
    frame();
    setInterval(frame, 1000);
    function play() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
    play();
    // Some browsers pause hidden-tab media; start again when shown.
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') play(); });
  }

  render({ status: 'home' });
  keepAwake();
  if (window.cast && window.cast.framework) receive();
  else if (location.protocol.indexOf('http') === 0) connect();
})();
</script>
</body>
</html>
